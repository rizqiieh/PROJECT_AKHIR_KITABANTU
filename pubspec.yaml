name: kitabantu
description: "KitaBantu — Crowdfunding Sosial dan Pengelolaan Zakat Digital"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  google_mlkit_text_recognition: ^0.13.0
  # --- State Management (Bab 3) ---
  flutter_riverpod: ^2.6.1

  # --- Autentikasi & Sesi (Bab 3) ---
  sqflite: ^2.4.2
  crypto: ^3.0.6
  flutter_secure_storage: ^9.2.4

  # --- Biometrik (Bab 3) ---
  local_auth: ^2.3.0

  # --- Database Online — Supabase (Bab 3) ---
  supabase_flutter: ^2.8.4

  # --- HTTP Client untuk API Kurs (Bab 3) ---
  http: ^1.3.0
  path: ^1.9.1

  # --- LBS & Peta (Bab 3) ---
  flutter_map: ^7.0.2
  geolocator: ^13.0.2
  latlong2: ^0.9.1

  # --- Waktu & Format (Bab 3) ---
  intl: ^0.20.2
  timezone: ^0.10.0

  # --- Sensor & Mini-game (Bab 3) ---
  sensors_plus: ^6.1.1

  # --- AI / LLM — Gemini (Bab 3) ---
  google_generative_ai: ^0.4.7

  # --- Notifikasi Lokal (Bab 3) ---
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  
